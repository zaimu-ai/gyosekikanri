<title>請求システム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: PCは左に常設のメニュー＋右に作業面。スマホは上の「メニュー」から開く。帳票はA4の実寸（mm）で組む */
:root {
  --bg: #F2F4F5; --surface: #FFFFFF; --surface-2: #E8ECEF; --fg: #161B20; --muted: #4A5560;
  --line: #7A8691; --line-soft: #CDD4DA; --head: #161B20;
  --accent: #0E5A8A; --accent-hover: #0A476E; --on-accent: #FFFFFF; --accent-soft: #DDEBF5;
  --ok: #1D6A39; --ok-soft: #E2F1E7; --warn: #7F4C00; --warn-soft: #FBEFD9; --err: #B42318; --err-soft: #FCE7E5;
  --focus: #000000; --focus-2: #FFD43D; --shadow: 0 1px 2px rgba(16,24,32,.08);
  --font: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
  --fs: 16px; --fs-s: 14px; --fs-l: 18px; --fs-h1: 26px; --fs-h2: 20px;
  --r: 8px; --nav-w: 224px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1317; --surface: #182027; --surface-2: #222C35; --fg: #E8EDF1; --muted: #AEB9C2;
  --line: #74818C; --line-soft: #34414C; --head: #E8EDF1;
  --accent: #78BCEC; --accent-hover: #9ACDF2; --on-accent: #07131C; --accent-soft: #16334A;
  --ok: #7DD59C; --ok-soft: #163424; --warn: #F2BF6C; --warn-soft: #3A2B11; --err: #FF9D94; --err-soft: #401A17;
  --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1317; --surface: #182027; --surface-2: #222C35; --fg: #E8EDF1; --muted: #AEB9C2;
  --line: #74818C; --line-soft: #34414C; --head: #E8EDF1;
  --accent: #78BCEC; --accent-hover: #9ACDF2; --on-accent: #07131C; --accent-soft: #16334A;
  --ok: #7DD59C; --ok-soft: #163424; --warn: #F2BF6C; --warn-soft: #3A2B11; --err: #FF9D94; --err-soft: #401A17;
  --shadow: none; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: var(--fs); line-height: 1.7; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { line-height: 1.4; margin: 0; text-wrap: balance; color: var(--head); }
h1 { font-size: var(--fs-h1); font-weight: 700; }
h2 { font-size: var(--fs-h2); font-weight: 700; }
h3 { font-size: var(--fs-l); font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
.num, .tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: var(--fs-s); }
.nowrap { white-space: nowrap; }
[hidden] { display: none !important; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 2px var(--focus-2); }
svg.lucide { width: 20px; height: 20px; flex: none; stroke-width: 2; vertical-align: -4px; }

/* ===== 骨組み ===== */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; min-height: 60px; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-mark { width: 34px; height: 34px; border-radius: 6px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.brand-mark svg.lucide { width: 20px; height: 20px; }
.brand-name { font-weight: 700; font-size: var(--fs); line-height: 1.3; min-width: 0; }
.brand-name small { display: block; font-weight: 400; font-size: var(--fs-s); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-state { font-size: var(--fs-s); color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.topbar .menu-btn { display: none; }
.layout { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: calc(100% - 61px); }
.nav { background: var(--surface); border-right: 1px solid var(--line); padding: 12px 8px 24px; }
.nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border-radius: 6px; color: var(--fg); text-decoration: none; font-weight: 400; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--fg); font-weight: 700; }
.nav a[aria-current="page"] svg { color: var(--accent); }
.nav .nav-sep { height: 1px; background: var(--line-soft); margin: 8px 12px; }
.nav .badge { margin-left: auto; min-width: 24px; padding: 0 6px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); font-size: var(--fs-s); line-height: 22px; text-align: center; font-weight: 700; }
main { min-width: 0; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 768px) { main { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
@media (max-width: 767px) {
  .topbar .menu-btn { display: inline-flex; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + 61px); left: 0; right: 0; bottom: 0; overflow: auto; border-right: 0; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .nav:not(.open) { display: none; }
  :root { --fs-h1: 22px; }
  .save-state .txt { display: none; }
}

/* ===== 見出し・カード ===== */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; }
.page-head .lead { color: var(--muted); margin-top: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card > h2, .card > .card-head { margin-bottom: 12px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.grid-cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.stat { display: grid; gap: 4px; }
.stat .label { color: var(--muted); font-size: var(--fs-s); display: flex; align-items: center; gap: 6px; }
.stat .value { font-size: 28px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat .value small { font-size: var(--fs); font-weight: 400; margin-left: 4px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.split { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .split.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* ===== ボタン ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; line-height: 1.3; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.text { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 4px; padding-inline: 8px; }
.btn.text:hover { background: var(--surface-2); }
.btn.danger { color: var(--err); border-color: var(--err); }
.btn.danger:hover { background: var(--err-soft); }
.btn.sm { min-height: 44px; padding: 6px 12px; font-size: var(--fs-s); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 48px; min-height: 48px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; padding: 0 12px; }
.icon-btn:hover { background: var(--surface-2); }

/* ===== 入力 ===== */
.form-grid { display: grid; gap: 16px 20px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.form-grid .wide { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; align-content: start; min-width: 0; }
.field > label, .field > .label { font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.req, .opt { font-size: var(--fs-s); font-weight: 400; }
.req { color: var(--err); }
.opt { color: var(--muted); }
.hint { font-size: var(--fs-s); color: var(--muted); }
input[type=text], input[type=date], input[type=number], input:not([type]), select, textarea {
  width: 100%; min-height: 48px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); font: inherit; }
input.numin { text-align: right; font-variant-numeric: tabular-nums; }
textarea { min-height: 88px; resize: vertical; }
.field.has-err input, .field.has-err select, .field.has-err textarea, input.has-err, select.has-err { border: 2px solid var(--err); }
.err-msg { color: var(--err); font-size: var(--fs-s); font-weight: 700; }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 4px var(--err); } 100% { box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; box-shadow: 0 0 0 4px var(--err); } html { scroll-behavior: auto !important; } }
.check { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { min-height: 44px; min-width: 56px; padding: 4px 12px; border: 0; background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }

/* ===== 表 ===== */
.tbl-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs); line-height: 1.3; }
.tbl th { text-align: left; font-weight: 700; padding: 10px 10px; border-bottom: 2px solid var(--head); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
.tbl td { padding: 10px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:hover td { background: var(--surface-2); }
.tbl tr.is-cancel td { color: var(--muted); }
.tbl tr.is-cancel td.strike { text-decoration: line-through; }
.tbl tfoot td { border-top: 2px solid var(--head); font-weight: 700; border-bottom: 0; }
.tbl .sub { display: block; color: var(--muted); font-size: var(--fs-s); }
.tbl td.act { white-space: nowrap; text-align: right; }
.tbl td.name { min-width: 11em; }
.tbl td.check-cell, .tbl th.check-cell { width: 56px; text-align: center; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }

/* ===== 状態・お知らせ ===== */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: var(--fs-s); line-height: 1.6; white-space: nowrap; background: var(--surface); color: var(--fg); }
.chip svg.lucide { width: 16px; height: 16px; vertical-align: -3px; }
.chip.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.chip.err { background: var(--err-soft); border-color: var(--err); color: var(--err); }
.chip.info { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.chip.mute { color: var(--muted); }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.notice > svg.lucide { margin-top: 3px; }
.notice .body { display: grid; gap: 4px; min-width: 0; }
.notice.info { border-color: var(--accent); background: var(--accent-soft); }
.notice.info > svg { color: var(--accent); }
.notice.warn { border-color: var(--warn); background: var(--warn-soft); }
.notice.warn > svg { color: var(--warn); }
.notice.err { border-color: var(--err); background: var(--err-soft); }
.notice.err > svg { color: var(--err); }
.notice.ok { border-color: var(--ok); background: var(--ok-soft); }
.notice.ok > svg { color: var(--ok); }
.mode-band { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--warn-soft); border-bottom: 1px solid var(--warn); color: var(--fg); font-size: var(--fs-s); }
.mode-band strong { color: var(--warn); display: inline-flex; gap: 6px; align-items: center; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: min(560px, calc(100% - 32px)); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 8px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.25); }

/* ===== 納品書の入力 ===== */
.lines { display: grid; gap: 14px; }
.line-card { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
.line-card.is-other { background: var(--surface); }
.line-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.line-no { font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.line-grid { display: grid; gap: 12px 16px; grid-template-columns: minmax(160px, 1.3fr) repeat(4, minmax(110px, 1fr)); align-items: end; }
.size-tbl { width: 100%; border-collapse: collapse; }
.size-tbl th { font-size: var(--fs-s); color: var(--muted); font-weight: 700; text-align: left; padding: 0 6px 4px; white-space: nowrap; }
.size-tbl td { padding: 4px 6px; vertical-align: middle; }
.size-tbl td.out { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
.size-tbl input { min-width: 84px; }
.calc-out { display: grid; gap: 2px; min-height: 48px; align-content: center; }
.calc-out .v { font-weight: 700; font-size: var(--fs-l); font-variant-numeric: tabular-nums; }
.totals { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: baseline; justify-content: flex-end; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.totals .t { display: grid; justify-items: end; }
.totals .t span { font-size: var(--fs-s); color: var(--muted); }
.totals .t b { font-size: 22px; font-variant-numeric: tabular-nums; }
.sticky-foot { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 4; background: var(--bg); padding-block: 12px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
@media (max-width: 900px) { .line-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .line-grid .mat { grid-column: 1 / -1; } }

/* ===== ダイアログ ===== */
dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; background: var(--surface); color: var(--fg); width: min(720px, calc(100% - 24px)); max-height: calc(100% - 24px); }
dialog.wide { width: min(1120px, calc(100% - 24px)); }
dialog::backdrop { background: rgba(10, 14, 18, .55); }
.dlg-hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 14px 20px; border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.dlg-bd { padding: 16px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.dlg-ft { display: flex; flex-wrap: wrap; gap: 10px 12px; justify-content: flex-end; padding: 12px 20px 16px; border-top: 1px solid var(--line-soft); position: sticky; bottom: 0; background: var(--surface); }

/* ===== 帳票（画面での見本） ===== */
.preview-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow: auto; max-height: 64vh; }
.preview-scale { transform-origin: top left; }
.preview-scale .page { box-shadow: 0 1px 6px rgba(0,0,0,.25); margin-bottom: 12px; }
#print-root { display: none; }
#pdf-stage { position: fixed; left: -20000px; top: 0; }

/* ===== 帳票（A4） ===== */
.page { width: 210mm; height: 297mm; background: #fff; color: #000; padding: 8mm 11mm; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font); line-height: 1.25; font-size: 9.5pt; }
.page * { color: #000; }
.half { height: 135mm; flex: none; display: flex; flex-direction: column; overflow: hidden; }
.half + .half { height: 141mm; border-top: 0.3mm dashed #888; padding-top: 6mm; margin-top: 3mm; }
.half.full { height: auto; flex: 1; }
.doc-title { font-size: 18pt; font-weight: 700; letter-spacing: 0.6em; text-align: center; border-bottom: 0.6mm double #000; padding: 0 2mm 1mm 4mm; justify-self: center; margin: 0 auto; }
.doc-head { display: grid; grid-template-columns: 1fr auto; gap: 2mm 6mm; align-items: start; margin-top: 2mm; }
.doc-no { text-align: right; font-size: 11pt; font-weight: 700; }
.doc-to { font-size: 12.5pt; font-weight: 700; border-bottom: 0.3mm solid #000; padding-bottom: 0.6mm; min-width: 78mm; display: flex; justify-content: space-between; gap: 6mm; }
.doc-to .hon { font-weight: 700; }
.doc-from { font-size: 8.5pt; line-height: 1.35; text-align: left; }
.doc-from .nm { font-size: 13pt; font-weight: 700; letter-spacing: 0.15em; }
.doc-msg { font-size: 9.5pt; margin-top: 1mm; }
.doc-date { font-size: 10pt; }
.dt { width: 100%; border-collapse: collapse; margin-top: 2mm; table-layout: fixed; }
.dt th { border: 0.3mm solid #000; background: #fff; font-weight: 700; font-size: 8.5pt; padding: 0.8mm 1.2mm; text-align: center; white-space: nowrap; overflow: hidden; }
.dt td { border-left: 0.3mm solid #000; border-right: 0.3mm solid #000; border-bottom: 0.15mm solid #777; padding: 0.6mm 1.2mm; font-size: 9pt; line-height: 1.15; vertical-align: top; height: 8.6mm; }
.dt td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dt td.c { text-align: center; }
.dt.compact td { height: 5.6mm; padding-top: 0.4mm; padding-bottom: 0.4mm; }
.dt tr.tot td { border: 0.3mm solid #000; font-weight: 700; height: 7mm; vertical-align: middle; }
.dt .mat { display: block; font-size: 8.5pt; }
.dt .sz { display: block; white-space: nowrap; }
.doc-foot { display: flex; justify-content: space-between; gap: 6mm; font-size: 8pt; margin-top: 1mm; }
.stamp-box { border: 0.3mm solid #000; width: 22mm; height: 20mm; display: grid; place-items: start center; font-size: 7.5pt; padding-top: 0.5mm; }
.sum-tbl { border-collapse: collapse; width: 100%; margin-top: 3mm; }
.sum-tbl th, .sum-tbl td { border: 0.3mm solid #000; padding: 1.6mm 2mm; font-size: 10pt; }
.sum-tbl th { font-weight: 700; text-align: center; }
.sum-tbl td.n { text-align: right; font-variant-numeric: tabular-nums; }
.total-box { display: inline-flex; align-items: center; gap: 4mm; border: 0.6mm solid #000; padding: 2mm 4mm; font-size: 13pt; font-weight: 700; }
.page-num { margin-top: auto; text-align: right; font-size: 7.5pt; padding-top: 1mm; }
.copy-label { display: inline-block; border: 0.3mm solid #000; padding: 0.2mm 2mm; font-size: 8pt; margin-left: 2mm; vertical-align: middle; letter-spacing: 0.1em; }

@media print {
  @page { size: A4 portrait; margin: 0; }
  html, body { background: #fff !important; height: auto; }
  body::before { display: none; }
