<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>業績管理</title>
<meta name="description" content="預金明細・仕訳帳・試算表・決算書を取り込み、予実管理（PL）・科目別の内訳分析・資金繰り表・KPIを自動で作るブラウザアプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#f0f0ed; --surface-3:#e6e6e2;
  --border:#d4d4cf; --border-strong:#8a8a84;
  --text:#1a1a1a; --text-2:#45453f; --text-3:#5f5f59;
  --primary:#0017c1; --primary-hover:#00118f; --on-primary:#ffffff; --primary-weak:#e8ecff;
  --good:#1a7a2e; --bad:#c3201f; --warn-bg:#fff3d1; --warn-text:#5c4100; --warn-border:#d9a300;
  --info-bg:#e8f0fe; --info-text:#123a7a;
  --focus-1:#ffd43d; --focus-2:#000000;
  --s-actual:#2a78d6; --s-prior:#eb6834; --s-budget:#a3a199; --s-line:#1baf7a;
  --grid:#e4e4df; --axis:#5f5f59;
  --radius:8px; --shadow:0 1px 2px rgba(0,0,0,.06); --auto-bg:#eef4fd;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141413; --surface:#1d1d1c; --surface-2:#262624; --surface-3:#30302d;
    --border:#3d3d3a; --border-strong:#8f8f88;
    --text:#f0efec; --text-2:#cfcec7; --text-3:#b3b2aa;
    --primary:#8fa2ff; --primary-hover:#b0beff; --on-primary:#0b0f33; --primary-weak:#232a55;
    --good:#5cc46c; --bad:#ff7b7a; --warn-bg:#3a2f0b; --warn-text:#ffe08a; --warn-border:#c98500;
    --info-bg:#1b2a45; --info-text:#c9dbff;
    --s-actual:#3987e5; --s-prior:#d95926; --s-budget:#77756e; --s-line:#199e70;
    --grid:#33332f; --axis:#b3b2aa; --shadow:none; --auto-bg:#1c2636;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141413; --surface:#1d1d1c; --surface-2:#262624; --surface-3:#30302d;
  --border:#3d3d3a; --border-strong:#8f8f88;
  --text:#f0efec; --text-2:#cfcec7; --text-3:#b3b2aa;
  --primary:#8fa2ff; --primary-hover:#b0beff; --on-primary:#0b0f33; --primary-weak:#232a55;
  --good:#5cc46c; --bad:#ff7b7a; --warn-bg:#3a2f0b; --warn-text:#ffe08a; --warn-border:#c98500;
  --info-bg:#1b2a45; --info-text:#c9dbff;
  --s-actual:#3987e5; --s-prior:#d95926; --s-budget:#77756e; --s-line:#199e70;
  --grid:#33332f; --axis:#b3b2aa; --shadow:none; --auto-bg:#1c2636;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:16px;line-height:1.7;letter-spacing:.01em}
h1,h2,h3{line-height:1.4;margin:0;font-weight:700}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:4px solid var(--focus-1);outline-offset:0;box-shadow:0 0 0 2px var(--focus-2) inset}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--text-3)}
.small{font-size:14px;line-height:1.5}
.good{color:var(--good)} .bad{color:var(--bad)}
.lucide{width:20px;height:20px;stroke-width:2;flex:none;vertical-align:middle}
.lucide[hidden],[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.hdr-row{max-width:1320px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;white-space:nowrap}
.brand .co{font-weight:400;font-size:14px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:14px;line-height:1.3;padding:4px 10px;border-radius:999px;border:1px solid var(--warn-border);background:var(--warn-bg);color:var(--warn-text);white-space:nowrap}
.badge .lucide{width:16px;height:16px}
.save-state{font-size:14px;color:var(--text-3);display:flex;align-items:center;gap:4px;white-space:nowrap}
.save-state .lucide{width:16px;height:16px}

.tabs{max-width:1320px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:0 14px;min-height:48px;display:flex;align-items:center;gap:6px;color:var(--text-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}

.toolbar{max-width:1320px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lbl{font-size:14px;line-height:1.4;color:var(--text-2);font-weight:500}
.req{font-size:12px;color:var(--bad);margin-left:4px;font-weight:700}
select,input[type=text],input[type=date],input[type=number],input[type=search],textarea{min-height:48px;padding:8px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);max-width:100%}
textarea{min-height:96px}
input::placeholder{color:var(--text-3)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;min-height:46px;padding:0 14px;cursor:pointer;color:var(--text-2);font-weight:500}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--primary);background:var(--surface);color:var(--primary);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--primary-weak)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.text{border-color:transparent;background:none}
.btn.text:hover{background:var(--surface-2);text-decoration:underline}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:transparent;text-decoration:underline}
.btn.sm{min-height:40px;padding:0 10px;font-size:14px}
.icon-btn{appearance:none;border:0;background:none;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius);cursor:pointer;color:var(--text-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.btn:disabled,.icon-btn:disabled{opacity:.45;cursor:not-allowed}

main{max-width:1320px;margin:0 auto;padding:16px 16px 96px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card-hd h2,.card-hd h3{margin-right:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}

.stat .lbl{font-size:14px;color:var(--text-2);font-weight:500}
.stat .val{font-size:28px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;margin:4px 0}
.stat .val small{font-size:14px;font-weight:400;color:var(--text-3);margin-left:4px}
.stat dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:14px;line-height:1.5}
.stat dt{color:var(--text-3)} .stat dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin-top:8px}
.meter>span{display:block;height:100%;background:var(--s-actual);border-radius:4px}

.notice{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius);background:var(--info-bg);color:var(--info-text);font-size:14px;line-height:1.6;border:1px solid transparent}
.notice.warn{background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn-border)}
.notice .lucide{margin-top:1px}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);max-width:100%;-webkit-overflow-scrolling:touch}
.tbl-wrap.tall{max-height:70vh}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:15px;line-height:1.3}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap}
.tbl thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-weight:700;font-size:14px;color:var(--text-2);text-align:right}
.tbl thead th:first-child{text-align:left}
.tbl th.rowh,.tbl td.rowh{position:sticky;left:0;z-index:1;text-align:left;font-weight:400}
.tbl thead th:first-child{position:sticky;left:0;z-index:3}
.tbl tr.head td{background:var(--surface-2);font-weight:700;font-size:14px;color:var(--text-2)}
.tbl tr.sub td{font-weight:700;background:var(--surface-2)}
.tbl tr.total td{font-weight:700;background:var(--primary-weak)}
.tbl tr.acc td.rowh{padding-left:22px}
.tbl tbody tr:hover td{filter:brightness(.97)}
.tbl td.na{color:var(--text-3)}
.tbl input.cell{min-height:36px;width:118px;padding:4px 8px;text-align:right;font-variant-numeric:tabular-nums;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.tbl input.cell:hover{border-color:var(--border-strong)}
.tbl input.cell.wide{width:180px;text-align:left}
.tbl th.future,.tbl td.future{background:var(--surface-2)}
.kind{display:inline-flex;align-items:center;min-height:32px;font-size:13px;line-height:1.3;padding:2px 10px;border-radius:4px;border:1px solid var(--border-strong);margin-top:2px;cursor:pointer;background:var(--surface);color:var(--text-2)}
.kind.actual{border-color:var(--primary);color:var(--primary)}
.low{color:var(--bad);font-weight:700}
.bar-cell{min-width:120px}
.hbar{height:10px;border-radius:4px;background:var(--s-actual)}
tr.clickable{cursor:pointer}
tr.selected td{background:var(--primary-weak)!important}

.chart-box{position:relative;height:300px}
.chart-fallback{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-3);font-size:14px;text-align:center}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;align-items:end}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-size:14px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;font-weight:500}

/* dialog */
dialog{border:1px solid var(--border);border-radius:12px;padding:0;background:var(--surface);color:var(--text);width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog[open]{display:flex;flex-direction:column;overflow:hidden}
dialog .dlg-bd{overflow:auto;flex:1 1 auto;min-height:0}
dialog .dlg-hd,dialog .dlg-ft{flex:none}
.dlg-hd{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.dlg-hd h2{margin-right:auto}
.dlg-bd{padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.dlg-ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px 16px;border-top:1px solid var(--border)}

/* toast */
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:560px}
.toast{pointer-events:auto;background:#1f1f1e;color:#fff;border-radius:var(--radius);padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast button{appearance:none;background:none;border:1px solid #fff;color:#fff;border-radius:6px;min-height:36px;padding:0 10px;cursor:pointer}

/* mobile */

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
.kv dt{color:var(--text-3)} .kv dd{margin:0}
.kvline{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:1.5}
.kvline>span:first-child{color:var(--text-3)}
.chk{width:22px;height:22px;accent-color:var(--primary);flex:none}
.dropzone{border:2px dashed var(--border-strong);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px}
.dropzone:hover,.dropzone.over{border-color:var(--primary);background:var(--primary-weak)}
.dropzone .lucide{width:32px;height:32px;color:var(--primary)}
.tbl th.autocol,.tbl td.autocol{background:var(--auto-bg)}
.kind.auto{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.tbl tr.unc td{background:var(--warn-bg)}
.tbl tr.chk td{font-size:14px;background:var(--surface-2)}
.icon-btn[aria-pressed="true"]{background:var(--primary-weak);color:var(--primary)}
@media (max-width:760px){
  .tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:0 0 env(safe-area-inset-bottom);justify-content:space-around;gap:0;max-width:none}
  .tab{flex:1;flex-direction:column;gap:2px;padding:6px 2px;min-height:60px;font-size:12px;line-height:1.2;border-bottom:0;border-top:3px solid transparent;justify-content:center}
  .tab[aria-selected="true"]{border-top-color:var(--primary);border-bottom-color:transparent}
  .tab .lucide{width:22px;height:22px}
  .brand .co{display:none}
  .stat .val{font-size:24px}
  .chart-box{height:240px}
  .hide-sm{display:none!important}
  main{padding-bottom:110px}
  .toolbar .field{flex:1 1 140px}
  .toolbar select{width:100%}
}
@media print{
  .app-header,.toolbar,.no-print,#toast{display:none!important}
  main{padding:0;max-width:none}
  .card{break-inside:avoid;box-shadow:none}
  .tbl-wrap{overflow:visible;max-height:none}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="hdr-row">
    <div class="brand"><i data-lucide="chart-column"></i><span>業績管理</span><span class="co" id="hdrCompany"></span></div>
    <span id="sampleBadge"></span>
    <div class="spacer"></div>
    <span class="save-state" id="saveState" aria-live="polite"></span>
    <button class="icon-btn" id="settingsBtn" type="button" title="設定・データ" aria-label="設定・データ" aria-pressed="false"><i data-lucide="settings"></i></button>
    <button class="icon-btn" id="themeBtn" type="button" title="表示テーマの切替" aria-label="表示テーマの切替"><i data-lucide="sun-moon"></i></button>
  </div>
  <nav class="tabs" role="tablist" aria-label="画面の切替" id="tabs"></nav>
</header>
<div class="toolbar no-print" id="toolbar"></div>
<main id="main" tabindex="-1"></main>
<div id="toast" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
/* =====================================================================
 * 業績管理 — 単一ファイルのブラウザアプリ
 * データはこの端末のブラウザ（IndexedDB）に自動保存されます。
 * ===================================================================== */
const KEY = 'gyosekikanri.data.v1';        // 旧保存先（localStorage）。移行後は .legacy に退避
const BKEY = 'gyosekikanri.backups.v1';
const UIKEY = 'gyosekikanri.ui.v1';
const THEMEKEY = 'gyosekikanri.theme';
const SCHEMA = 2;
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';

const CATS = [
  { id: 'sales', label: '売上高', cost: false },
  { id: 'cogs', label: '売上原価', cost: true },
  { id: 'sga', label: '販売費及び一般管理費', cost: true },
  { id: 'noi', label: '営業外収益', cost: false },
  { id: 'noe', label: '営業外費用', cost: true },
  { id: 'spi', label: '特別利益', cost: false, opt: true },
  { id: 'spl', label: '特別損失', cost: true, opt: true },
  { id: 'ctax', label: '法人税等', cost: true, opt: true },
  { id: 'bs', label: '貸借対照表科目', cost: false, bs: true },
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const PLCATS = CATS.filter(c => !c.bs);
const isPL = a => a && CAT[a.cat] && !CAT[a.cat].bs;
const CASH_SECS = [
  { id: 'in', label: '経常収入' }, { id: 'out', label: '経常支出' },
  { id: 'fin_in', label: '財務収入' }, { id: 'fin_out', label: '財務支出' },
];
const ITEMS = {
  ar: { sec: 'in', name: '売掛金回収' }, cashsales: { sec: 'in', name: '現金売上' }, otherin: { sec: 'in', name: 'その他入金' }, unin: { sec: 'in', name: '未分類の入金' },
  ap: { sec: 'out', name: '買掛金・外注費支払' }, payroll: { sec: 'out', name: '人件費' }, exp: { sec: 'out', name: '諸経費' }, interest: { sec: 'out', name: '支払利息' }, tax: { sec: 'out', name: '税金・社会保険料' }, unout: { sec: 'out', name: '未分類の出金' },
  loanin: { sec: 'fin_in', name: '借入金' }, finin: { sec: 'fin_in', name: 'その他財務収入' },
  loanout: { sec: 'fin_out', name: '借入金返済' }, capex: { sec: 'fin_out', name: '設備投資' }, finout: { sec: 'fin_out', name: 'その他財務支出' },
  transfer: { sec: null, name: '資金移動（自社口座間・集計しない）' },
};
const TEMPLATE_KEYS = ['ar', 'cashsales', 'otherin', 'ap', 'payroll', 'exp', 'interest', 'tax', 'loanin', 'finin', 'loanout', 'capex'];
const TABS = [
  { id: 'dash', label: 'ダッシュボード', short: 'ホーム', icon: 'layout-dashboard' },
  { id: 'pl', label: '予実管理（PL）', short: '予実', icon: 'sheet' },
  { id: 'detail', label: '科目別明細・内訳', short: '明細', icon: 'list-tree' },
  { id: 'cash', label: '資金繰り表', short: '資金繰り', icon: 'wallet' },
  { id: 'kpi', label: 'KPI', short: 'KPI', icon: 'target' },
  { id: 'import', label: 'データ取込', short: '取込', icon: 'file-input' },
];
const SRC_LABEL = { manual: '手入力', csv: '明細CSV', sample: 'サンプル', journal: '仕訳帳', ledger: '総勘定元帳', tb: '試算表', bank: '預金明細' };
const TYPE_LABEL = { bank: '預金明細・通帳', journal: '仕訳帳', ledger: '総勘定元帳', tb: '試算表・推移表', fs: '決算書' };

const RE = {
  cash: /^(現金|小口現金)$|普通預金|当座預金|通知預金|^現金預金$/,

  const sm = matchMedia('(max-width:760px)').matches;
  $('#tabs').innerHTML = TABS.map(t => `<button class="tab" role="tab" type="button" data-tab="${t.id}" aria-selected="${ui.tab === t.id}">${icon(t.icon)}<span>${sm ? t.short : t.label}</span></button>`).join('');
}
function fyOptions() {
  const set = new Set();
  const cur = fyIdx(isoDate(new Date())).fy;
  [cur - 1, cur, cur + 1].forEach(y => set.add(y));
  for (const e of S.entries) set.add(fyIdx(e.date).fy);
  for (const t of S.cashTx) set.add(fyIdx(t.date).fy);
  for (const k of ['budgets', 'cash', 'tb', 'annual']) Object.keys(S[k] || {}).forEach(y => set.add(Number(y)));
  return [...set].filter(Number.isFinite).sort((a, b) => b - a);
}
function ensureUi() {
  if (ui.fy == null || !Number.isFinite(ui.fy)) {
    const cur = fyIdx(isoDate(new Date())).fy;
    const ys = S.entries.map(e => fyIdx(e.date).fy);
    ui.fy = lastIdx(cur) >= 0 || !ys.length ? cur : Math.max(...ys);
  }
  if (ui.m == null || ui.m < 0 || ui.m > 11) { const l = lastIdx(ui.fy); ui.m = l >= 0 ? l : 0; }
}
function renderToolbar() {
  ensureUi();
  const tb = $('#toolbar');
  if (ui.tab === 'settings') { tb.innerHTML = ''; return; }
  const last = lastIdx(ui.fy);
  const showMode = ['dash', 'pl', 'kpi'].includes(ui.tab);
  const showMonth = !['detail'].includes(ui.tab);
  tb.innerHTML = `
    <div class="field"><label for="tbFy">年度</label>
      <select id="tbFy">${fyOptions().map(y => `<option value="${y}" ${y === ui.fy ? 'selected' : ''}>${fyLabel(y)}</option>`).join('')}</select></div>
    ${showMonth ? `<div class="field"><label for="tbM">対象月</label>
      <select id="tbM">${months12().map((l, i) => `<option value="${i}" ${i === ui.m ? 'selected' : ''}>${yearOf(ui.fy, i)}年${l}${i <= last ? '' : '（実績未確定）'}</option>`).join('')}</select></div>` : ''}
    ${showMode ? `<div class="field"><span class="lbl" id="modeLbl">集計期間</span>
      <div class="seg" role="group" aria-labelledby="modeLbl">
        ${[['month', '単月'], ['cum', '期首から累計'], ['year', '通期']].map(([k, l]) => `<button type="button" data-mode="${k}" aria-pressed="${ui.mode === k}">${l}</button>`).join('')}
      </div></div>` : ''}
    <div class="small muted" style="padding-bottom:12px">${fyRangeText(ui.fy)}／実績の締め月：${last >= 0 ? `${yearOf(ui.fy, last)}年${mLabel(last)}` : 'この年度の実績はまだありません'}</div>`;
}
function periodText() {
  if (ui.mode === 'month') return `${yearOf(ui.fy, ui.m)}年${mLabel(ui.m)}`;
  if (ui.mode === 'cum') return `${mLabel(0)}〜${mLabel(ui.m)}累計`;
  return `${fyLabel(ui.fy)}通期`;
}
function futureNotice() {
  const { last, gaps } = agg(ui.fy);
  let h = '';
  if (ui.mode !== 'year' && ui.m > last) h += `<div class="notice warn">${icon('triangle-alert')}<span>${mLabel(ui.m)}の実績はまだ確定していません（実績は${last >= 0 ? mLabel(last) + 'まで' : '未登録'}）。実績・差異は「—」で表示しています。</span></div>`;
  const g = gaps.filter(i => ui.mode === 'year' || i <= ui.m);
  if (g.length) h += `<div class="notice warn">${icon('triangle-alert')}<span>実績データのない月があります：${g.map(mLabel).join('、')}。その月は「—」とし、累計に含めていません。</span></div>`;
  return h;
}
function srcLine() {
  const { monthSrc } = agg(ui.fy);
  const parts = [];
  monthSrc.forEach((s, i) => { if (s) parts.push(`${mLabel(i)}：${s.join('＋')}`); });
  return parts.length ? `<details class="small muted"><summary>${icon('info')}実績の元データ（月別）</summary><p>${parts.join('　')}</p><p>同じ月に仕訳帳と総勘定元帳がある場合は仕訳帳を使い、二重に数えません。どちらもない月は試算表を使います。</p></details>` : '';
}

/* ---------- ダッシュボード ---------- */
function viewDash(main) {
  const fy = ui.fy, set = plSet(fy), { A, B, P, last, plast } = set, mode = ui.mode, m = ui.m;
  const card = (key, label) => {
    const idx = A.findIndex(r => r.key === key);
    const a = A[idx], b = B[idx], p = P[idx];
    const av = mode === 'year' ? pick(a.vals, 'year') : pick(a.vals, mode, m, last);
    const bv = pick(b.vals, mode, m, null);
    const pv = mode === 'year' ? priorYear(set, idx).v : pick(p.vals, mode, m, plast);
    const fc = mode === 'year' ? forecast(a.vals, b.vals, last) : null;
    const salesA = rowByKey(A, 'sub_sales');
    const sv = mode === 'year' ? pick(salesA.vals, 'year') : pick(salesA.vals, mode, m, last);
    const r = rate(av, bv);
    return `<div class="card stat">
      <div class="lbl">${label}</div>
      <div class="val">${yen(av)}<small>${unitK() ? '千円' : '円'}</small></div>
      <dl>
        ${mode === 'year' ? `<dt>年間予算</dt><dd>${yen(bv)}</dd><dt>進捗率</dt><dd>${pct(r)}</dd><dt>着地見込</dt><dd>${yen(fc)}</dd><dt>着地見込の前年比</dt><dd>${pct(rate(fc, pv))}</dd>`
        : `<dt>予算</dt><dd>${yen(bv)}</dd><dt>予算差異</dt><dd class="${fav(av != null && bv != null ? av - bv : null, false)}">${av != null && bv != null ? yenSigned(av - bv) : '—'}</dd><dt>達成率</dt><dd>${pct(r)}</dd><dt>前年比</dt><dd>${pct(rate(av, pv))}</dd>`}
        ${key !== 'sub_sales' ? `<dt>売上高比</dt><dd>${pct(av != null && sv ? av / sv : null)}</dd>` : ''}
      </dl>
      ${r != null ? `<div class="meter" role="img" aria-label="達成率 ${pct(r)}"><span style="width:${Math.min(100, Math.max(0, r * 100))}%"></span></div>` : ''}
    </div>`;
  };
  const cf = cashCalc(fy);
  const cashIdx = mode === 'year' ? 11 : m;
  const cashVal = cf && cf.hasInput[cashIdx] ? cf.close[cashIdx] : null;
  const minCash = Number(S.settings.minCash) || 0;
  const lowMonths = cf ? cf.close.map((v, i) => [v, i]).filter(([v, i]) => cf.hasInput[i] && v < minCash) : [];
  const kindTxt = k => ({ auto: '実績（取込データから自動）', actual: '実績（手入力）', plan: '予定' }[k]);
  const alerts = [];
  if (mode !== 'year' && m <= last) {
    for (const r of A.filter(r => r.type === 'acc')) {
      const b = rowByKey(B, r.key);
      const av = pick(r.vals, mode, m, last), bv = pick(b.vals, mode, m, null);
      if (av == null || bv == null || bv === 0) continue;
      const d = av - bv;
      if (fav(d, r.cost) === 'bad' && Math.abs(d) / Math.abs(bv) >= 0.1) alerts.push({ r, av, bv, d });
    }
    alerts.sort((x, y) => Math.abs(y.d) - Math.abs(x.d));
  }
  const unCount = S.cashTx.filter(t => fyIdx(t.date).fy === fy && (t.key === 'unin' || t.key === 'unout')).length;
  const kpiRows = S.kpis.slice(0, 5).map(k => { const v = kpiPeriod(k, fy); return `<tr><td class="rowh">${esc(k.name)}</td><td class="num">${kpiFmt(v.t, k)}</td><td class="num">${kpiFmt(v.a, k)}</td><td class="num ${v.r == null ? '' : ((v.r >= 1) === (k.dir !== 'down') ? 'good' : 'bad')}">${pct(v.r)}</td><td class="num">${pct(v.yoy)}</td></tr>`; }).join('');
  const hasNet = !!rowByKey(A, 'net');

  main.innerHTML = `<div class="stack">
    ${futureNotice()}
    ${unCount ? `<div class="notice warn">${icon('triangle-alert')}<span>資金繰りの取込データに未分類の取引が${unCount}件あります。<button class="btn text sm" data-go="import">分類を確認する</button></span></div>` : ''}
    <div class="row"><h2 style="margin-right:auto">${fyLabel(fy)}　${periodText()}</h2><span class="small muted">${unitNote()}・${esc(S.settings.tax)}</span></div>
    <div class="grid g-kpi">
      ${card('sub_sales', '売上高')}${card('gross', '売上総利益（粗利）')}${card('op', '営業利益')}${card('ord', '経常利益')}${hasNet ? card('net', '当期純利益') : ''}
      <div class="card stat"><div class="lbl">現預金残高（${yearOf(fy, cashIdx)}年${mLabel(cashIdx)}末）</div>
        <div class="val">${yen(cashVal)}<small>${unitK() ? '千円' : '円'}</small></div>
        <dl><dt>区分</dt><dd>${cf ? (cf.hasInput[cashIdx] ? kindTxt(cf.kind[cashIdx]) : '未入力') : '資金繰り表が未作成'}</dd>
        ${cf && cf.ac.actual[cashIdx] != null ? `<dt>${cf.ac.actualSrc[cashIdx]}</dt><dd>${yen(cf.ac.actual[cashIdx])}</dd>` : ''}
        <dt>警戒ライン</dt><dd>${yen(minCash)}</dd></dl>
        ${lowMonths.length ? `<div class="notice warn" style="margin-top:8px">${icon('triangle-alert')}<span>警戒ラインを下回る月：${lowMonths.map(([, i]) => mLabel(i)).join('、')}</span></div>` : ''}
      </div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="card-hd"><h3>売上高（月次）</h3><span class="small muted">${unitNote()}</span></div><div class="chart-box"><canvas id="cSales" role="img" aria-label="月次売上高の予算・実績・前年実績"></canvas></div></div>
      <div class="card"><div class="card-hd"><h3>営業利益（月次）</h3></div><div class="chart-box"><canvas id="cOp" role="img" aria-label="月次営業利益の予算・実績・前年実績"></canvas></div></div>
      <div class="card"><div class="card-hd"><h3>売上高（期首からの累計）</h3></div><div class="chart-box"><canvas id="cCum" role="img" aria-label="累計売上高の推移"></canvas></div></div>
      <div class="card"><div class="card-hd"><h3>現預金残高（月末）</h3><button class="btn text sm" data-go="cash">資金繰り表へ${icon('chevron-right')}</button></div><div class="chart-box"><canvas id="cCash" role="img" aria-label="月末現預金残高の推移"></canvas></div></div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="card-hd"><h3>要確認：予算を10%以上超過している費用・不足している収益</h3></div>
        ${mode === 'year' ? '<p class="small muted">通期表示では表示しません。単月または累計を選んでください。</p>' : alerts.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>勘定科目</th><th>予算</th><th>実績</th><th>差異</th></tr></thead><tbody>
          ${alerts.slice(0, 8).map(x => `<tr class="clickable" data-detail="${x.r.key}"><td class="rowh">${esc(x.r.label)}</td><td class="num">${yen(x.bv)}</td><td class="num">${yen(x.av)}</td><td class="num bad">${yenSigned(x.d)}</td></tr>`).join('')}
        </tbody></table></div><p class="small muted" style="margin-top:6px">行を選ぶと科目別明細を開きます。</p>` : `<p class="small muted">${m > last ? '実績が未確定のため判定できません。' : '該当する科目はありません。'}</p>`}
      </div>
      <div class="card"><div class="card-hd"><h3>KPI（${periodText()}）</h3><button class="btn text sm" data-go="kpi">KPIへ${icon('chevron-right')}</button></div>
        ${S.kpis.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>指標</th><th>目標</th><th>実績</th><th>達成率</th><th>前年比</th></tr></thead><tbody>${kpiRows}</tbody></table></div>` : '<p class="small muted">KPIはまだ登録されていません。</p>'}
      </div>
    </div>
    ${srcLine()}
  </div>`;

  const sA = rowByKey(A, 'sub_sales').vals, sB = rowByKey(B, 'sub_sales').vals, sP = rowByKey(P, 'sub_sales').vals;
  mkChart('cSales', { data: { labels: months12(), datasets: [barDs('予算', sB, css('--s-budget')), barDs('実績', sA, css('--s-actual')), lineDs('前年実績', sP, css('--s-prior'))] } });
  const oA = rowByKey(A, 'op').vals, oB = rowByKey(B, 'op').vals, oP = rowByKey(P, 'op').vals;
  mkChart('cOp', { data: { labels: months12(), datasets: [barDs('予算', oB, css('--s-budget')), barDs('実績', oA, css('--s-actual')), lineDs('前年実績', oP, css('--s-prior'))] } });
  const cum = v => { let s = null; return v.map(x => x == null ? null : (s = add(s, x))); };
  mkChart('cCum', { data: { labels: months12(), datasets: [lineDs('予算累計', cum(sB), css('--s-budget'), { borderDash: [6, 4] }), lineDs('実績累計', cum(sA), css('--s-actual')), lineDs('前年累計', cum(sP), css('--s-prior'))] } });
  if (cf) mkChart('cCash', { data: { labels: months12(), datasets: [lineDs('月末残高（資金繰り表）', cf.close.map((v, i) => cf.hasInput[i] ? v : null), css('--s-actual')), ...(cf.ac.actual.some(v => v != null) ? [lineDs('実残高（通帳・試算表）', cf.ac.actual, css('--s-line'), { borderDash: [2, 3] })] : []), lineDs('警戒ライン', Array(12).fill(minCash), css('--bad'), { borderDash: [4, 4], pointRadius: 0, borderWidth: 1.5 })] } });
  else $('#cCash').parentElement.innerHTML = '<div class="chart-fallback">この年度の資金繰り表はまだありません。</div>';
}

/* ---------- 予実管理（PL） ---------- */
function viewPL(main) {
  const fy = ui.fy, set = plSet(fy), { A, B, P, last, plast } = set, mode = ui.mode, m = ui.m;
  const salesA = rowByKey(A, 'sub_sales'), salesB = rowByKey(B, 'sub_sales');
  const pySrc = set.plast === 11 ? '' : set.Y ? '（前期決算書）' : '';
  let head, body = '';
  if (mode === 'year') {
    head = `<th>勘定科目</th><th>年間予算</th><th>実績累計${last >= 0 ? `（〜${mLabel(last)}）` : ''}</th><th>進捗率</th><th>着地見込<br><span class="small" style="font-weight:400">実績＋残月予算</span></th><th>見込差異</th><th>前年通期${pySrc}</th><th>見込の前年比</th>`;
  } else {
    head = `<th>勘定科目</th><th>予算</th><th>実績</th><th>差異</th><th>達成率</th><th>売上高比</th><th>前年実績</th><th>前年比</th>`;
  }
  A.forEach((a, idx) => {
    const b = B[idx], p = P[idx];
    if (a.type === 'head') { body += `<tr class="head"><td class="rowh" colspan="8">${esc(a.label)}</td></tr>`; return; }
    let cells;
    if (mode === 'year') {
      const bv = sumN(b.vals), av = sumN(a.vals), fc = forecast(a.vals, b.vals, last), pv = priorYear(set, idx).v;
      const d = fc != null && bv != null ? fc - bv : null;
      cells = `<td class="num">${yen(bv)}</td><td class="num">${yen(av)}</td><td class="num">${pct(rate(av, bv))}</td><td class="num">${yen(fc)}</td><td class="num ${fav(d, a.cost)}">${yenSigned(d)}</td><td class="num">${yen(pv)}</td><td class="num">${pct(rate(fc, pv))}</td>`;
    } else {
      const bv = pick(b.vals, mode, m, null), av = pick(a.vals, mode, m, last), pv = pick(p.vals, mode, m, plast);
      const sv = pick(salesA.vals, mode, m, last);
      const d = av != null && bv != null ? av - bv : null;
      cells = `<td class="num">${yen(bv)}</td><td class="num ${av == null ? 'na' : ''}">${yen(av)}</td><td class="num ${fav(d, a.cost)}">${yenSigned(d)}</td><td class="num">${pct(rate(av, bv))}</td><td class="num">${pct(av != null && sv ? av / sv : null)}</td><td class="num">${yen(pv)}</td><td class="num">${pct(rate(av, pv))}</td>`;
    }
    const label = a.type === 'acc' ? `<button class="btn text sm" style="min-height:28px;padding:0 4px;font-weight:400" data-detail="${a.key}" title="この科目の明細を見る">${esc(a.label)}</button>` : esc(a.label);
    body += `<tr class="${a.type}"><td class="rowh">${label}</td>${cells}</tr>`;
  });
  const ser = ui.plSeries;
  const sers = [['actual', '実績'], ['budget', '予算'], ['diff', '予算差異'], ['prior', '前年実績'], ['yoy', '前年比'], ['ratio', '売上高比（実績）']];
  let tBody = '';
  A.forEach((a, idx) => {
    const b = B[idx], p = P[idx];
    if (a.type === 'head') { tBody += `<tr class="head"><td class="rowh" colspan="14">${esc(a.label)}</td></tr>`; return; }
    const v = i => {
      const av = i <= last ? a.vals[i] : null;
      switch (ser) {
        case 'actual': return yen(av);
        case 'budget': return yen(b.vals[i]);
        case 'diff': return av != null && b.vals[i] != null ? `<span class="${fav(av - b.vals[i], a.cost)}">${yenSigned(av - b.vals[i])}</span>` : '—';
        case 'prior': return yen(i <= plast ? p.vals[i] : null);
        case 'yoy': return pct(rate(av, i <= plast ? p.vals[i] : null));
        case 'ratio': return pct(av != null && salesA.vals[i] ? av / salesA.vals[i] : null);
      }
    };
    const tot = (() => {
      const av = sumN(a.vals), bv = sumN(b.vals), pv = sumN(p.vals.map((x, i) => a.vals[i] != null ? x : null));
      switch (ser) {
        case 'actual': return yen(av);
        case 'budget': return yen(bv);
        case 'diff': { const bb = sumN(b.vals.map((x, i) => a.vals[i] != null ? x : null)); return av != null && bb != null ? `<span class="${fav(av - bb, a.cost)}">${yenSigned(av - bb)}</span>` : '—'; }
        case 'prior': return yen(sumN(p.vals));
        case 'yoy': return pct(rate(av, pv));
        case 'ratio': return pct(av != null && sumN(salesA.vals) ? av / sumN(salesA.vals) : null);
      }
    })();
    tBody += `<tr class="${a.type}"><td class="rowh">${esc(a.label)}</td>${Array.from({ length: 12 }, (_, i) => `<td class="num ${i > last && ['actual', 'diff', 'yoy', 'ratio'].includes(ser) ? 'future' : ''}">${v(i)}</td>`).join('')}<td class="num" style="font-weight:700">${tot}</td></tr>`;
  });
  const chartKeys = A.filter(r => r.type !== 'head').map(r => [r.key, r.label]);
  const sel = rowByKey(A, ui.plChart) ? ui.plChart : 'sub_sales';
  main.innerHTML = `<div class="stack">
    ${futureNotice()}
    <div class="card">
      <div class="card-hd"><h2>予実比較　${periodText()}</h2><span class="small muted">${unitNote()}・${esc(S.settings.tax)}</span>
        <button class="btn sm" data-act="csvPL">${icon('file-down')}CSV出力</button><button class="btn sm hide-sm" onclick="window.print()">${icon('printer')}印刷</button></div>
      ${salesB.vals.every(v => v == null) ? `<div class="notice" style="margin-bottom:12px">${icon('info')}<span>この年度の予算が未設定です。「設定・データ」の予算入力で設定すると、差異・達成率が表示されます（前年実績や前期決算書からの一括作成もできます）。</span></div>` : ''}
      <div class="tbl-wrap tall"><table class="tbl" id="plTable"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <p class="small muted" style="margin-top:8px">差異の色：<span class="good">緑＝予算より有利</span>／<span class="bad">赤＝不利</span>（費用は予算より少ないほど有利）。負の数は「△」で表示。「—」は未設定・未確定。</p>
      ${srcLine()}
    </div>
    <div class="card">
      <div class="card-hd"><h2>月次推移</h2>
        <div class="field"><label for="plSer" class="sr-only">表示する値</label><select id="plSer">${sers.map(([k, l]) => `<option value="${k}" ${k === ser ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
      <div class="tbl-wrap tall"><table class="tbl"><thead><tr><th>勘定科目</th>${months12().map((l, i) => `<th class="${i > last ? 'future' : ''}">${l}</th>`).join('')}<th>${ser === 'diff' || ser === 'yoy' ? '締め月まで' : '合計'}</th></tr></thead><tbody>${tBody}</tbody></table></div>
    </div>
    <div class="card">
      <div class="card-hd"><h2>グラフ</h2><div class="field"><label for="plChartSel" class="sr-only">グラフの科目</label><select id="plChartSel">${chartKeys.map(([k, l]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div></div>
      <div class="chart-box"><canvas id="cPL" role="img" aria-label="選択科目の月次推移"></canvas></div>
    </div>
  </div>`;
  const ra = rowByKey(A, sel), rb = rowByKey(B, sel), rp = rowByKey(P, sel);
  mkChart('cPL', { data: { labels: months12(), datasets: [barDs('予算', rb.vals, css('--s-budget')), barDs('実績', ra.vals, css('--s-actual')), lineDs('前年実績', rp.vals, css('--s-prior'))] } });
}
function csvPL() {
  const fy = ui.fy, { A, B, P } = plSet(fy);
  const rows = [['勘定科目', '区分', ...months12().map(l => l + '予算'), ...months12().map(l => l + '実績'), ...months12().map(l => l + '前年')]];
  A.forEach((a, i) => { if (a.type === 'head') return; rows.push([a.label, a.type === 'acc' ? '科目' : '集計', ...B[i].vals.map(v => v ?? ''), ...a.vals.map(v => v ?? ''), ...P[i].vals.map(v => v ?? '')]); });
  return download(`予実_${fyLabel(fy)}_${stamp()}.csv`, '﻿' + toCsv(rows), 'text/csv');
}

function entryFilter(fy, y) {
  const d = ui.d, accMap = Object.fromEntries(S.accounts.map(a => [a.id, a])), last = lastIdx(fy);
  const toP = Math.min(d.to, last);
  const q = d.q.trim().toLowerCase();
  return e => {
    const f = fyIdx(e.date);
    if (f.fy !== y || f.i < d.from || f.i > (y === fy ? d.to : toP)) return false;
    if (d.cat && accMap[e.acc]?.cat !== d.cat) return false;
    if (d.acc && e.acc !== d.acc) return false;
    if (q && !((e.partner || '').toLowerCase().includes(q) || (e.memo || '').toLowerCase().includes(q))) return false;
    return true;
  };
}

function submitEntry() {

    const e = S.entries.find(x => x.id === ui.editId);
    Object.assign(e, { date: f.date, acc: f.acc, partner: f.partner, amount: amt, memo: f.memo, updated: Date.now() });
    ui.editId = null;
    save('修正を保存しました');
  } else {
    S.entries.push({ id: uid(), date: f.date, acc: f.acc, partner: f.partner, amount: amt, memo: f.memo, created: Date.now(), st: 'manual' });

  const fi = fyIdx(f.date);

  render();

}

/* ---------- CSV ---------- */
function toCsv(rows) { return rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\r\n'); }
function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const tab = !text.slice(0, 2000).includes(',') && text.slice(0, 2000).includes('\t');
  const sep = tab ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
// 日付の解釈：西暦／和暦（令和・平成）／2桁年（通帳）／月日のみ
function reiwaNow() { return new Date().getFullYear() - 2018; }
function parseJpDate(s, o = {}) {
  s = nfkc(s).replace(/\s+/g, '');
  if (!s) return null;
  let y, mo, d, m;
  if ((m = s.match(/^(令和|平成|昭和|R|H|S)(\d{1,2}|元)[年.\-\/](\d{1,2})[月.\-\/](\d{1,2})日?/i))) {
    const n = m[2] === '元' ? 1 : +m[2], e = m[1].toUpperCase();
    y = (e === '令和' || e === 'R') ? 2018 + n : (e === '平成' || e === 'H') ? 1988 + n : 1925 + n; mo = +m[3]; d = +m[4];
  } else if ((m = s.match(/^(\d{4})[年.\-\/](\d{1,2})[月.\-\/](\d{1,2})日?/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = s.match(/^(\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/))) {
    const n = +m[1]; const mode = o.yy || 'auto';
    y = mode === 'west' ? 2000 + n : mode === 'heisei' ? 1988 + n : mode === 'reiwa' ? 2018 + n : (n <= reiwaNow() + 1 ? 2018 + n : 1988 + n);
    mo = +m[2]; d = +m[3]; if (o.flags) o.flags.yy = true;
  } else if ((m = s.match(/^(\d{1,2})[.\-\/月](\d{1,2})日?$/))) {
    mo = +m[1]; d = +m[2]; if (o.flags) o.flags.md = true;
    if (o.fy == null) return null;
    y = yearOf(o.fy, idxOfMonth(mo));
  } else return null;
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${pad2(mo)}-${pad2(d)}`;
}
const normDate = s => parseJpDate(s);
async function readFileText(file) {
  const buf = await file.arrayBuffer();
  let t = new TextDecoder('utf-8', { fatal: false }).decode(buf);
  if (t.includes('\ufffd')) { try { t = new TextDecoder('shift_jis').decode(buf); } catch (e) { } } // Excel既定のShift_JISにも対応
  return t;
}
function pickFile(accept, cb, multiple) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept; inp.multiple = !!multiple;
  inp.style.display = 'none'; document.body.appendChild(inp);   // 画面に置いておく（ブラウザによっては必要）
  inp.onchange = () => { const fs = [...inp.files]; inp.remove(); if (fs.length) cb(multiple ? fs : fs[0]); };
  inp.click();
}
function importCsvFlow() {
  pickFile('.csv,.txt,text/csv', async file => {
    const rows = parseCsv(await readFileText(file));
    if (!rows.length) return toast('CSVに行がありません。');
    const H = rows[0].map(h => h.trim());
    const find = names => H.findIndex(h => names.some(n => h.includes(n)));
    let ci = { date: find(['日付', '取引日', '伝票日付']), acc: find(['勘定科目', '科目']), partner: find(['取引先', '補助科目', '相手先']), amount: find(['金額']), memo: find(['摘要', '備考', 'メモ']) };
    let start = 1;
    if (ci.date < 0 || ci.acc < 0 || ci.amount < 0) { ci = { date: 0, acc: 1, partner: 2, amount: 3, memo: 4 }; start = normDate(rows[0][0]) ? 0 : 1; }
    if (H.some(h => /借方/.test(h)) && H.some(h => /貸方/.test(h))) return toast('借方・貸方のあるファイルです。「データ取込」から仕訳帳として取り込んでください。');
    const nameToId = Object.fromEntries(S.accounts.map(a => [normName(a.name), a.id]));
    const keyOf = e => [e.date, e.acc, e.partner || '', e.amount, e.memo || ''].join('|');
    const existing = new Set(S.entries.map(keyOf));
    const ok = [], bad = [], unknown = new Set();
    for (let r = start; r < rows.length; r++) {
      const c = rows[r];
      const date = normDate(c[ci.date] || ''), accName = nfkc(c[ci.acc] || ''), amt = parseNum(c[ci.amount]);
      const reasons = [];
      if (!date) reasons.push('日付が読めません');
      if (!accName) reasons.push('勘定科目が空です');
      if (amt == null || Number.isNaN(amt)) reasons.push('金額が数字ではありません');
      if (reasons.length) { bad.push(`${r + 1}行目：${reasons.join('、')}`); continue; }
      if (!nameToId[normName(accName)]) unknown.add(accName);
      ok.push({ date, accName, partner: ci.partner >= 0 ? (c[ci.partner] || '').trim() : '', amount: Math.round(amt), memo: ci.memo >= 0 ? (c[ci.memo] || '').trim() : '' });
    }
    const idOf = n => nameToId[normName(n)];
    const dupCount = ok.filter(e => idOf(e.accName) && existing.has(keyOf({ ...e, acc: idOf(e.accName) }))).length;
    const dates = ok.map(e => e.date).sort();
    openDialog('CSV取込の確認', `
      <p>ファイル：${esc(file.name)}</p>
      <dl class="kv small"><dt>取り込める行</dt><dd>${ok.length.toLocaleString('ja-JP')}件${dates.length ? `（${dates[0]}〜${dates[dates.length - 1]}）` : ''}</dd>

  if (tbl.headers) {
    const monthCols = tbl.headers.map((h, i) => [nfkc(h).match(/^(\d{1,2})月/), i]).filter(([m]) => m && +m[1] >= 1 && +m[1] <= 12);
    if (monthCols.length >= 2) {
      const accI = tbl.headers.findIndex(h => /科目/.test(h)); const ai = accI >= 0 ? accI : 0;
      const rows = [];
      for (const r of tbl.rows) {
        const name = nfkc(r[ai]); if (!name) continue;
        const mv = {}; let any = false;
        for (const [m, i] of monthCols) { const v = parseNum(r[i]); if (v != null && !Number.isNaN(v)) { mv[idxOfMonth(+m[1])] = v; any = true; } }
        if (any) rows.push({ name, mv });

    }

  const map = o.map || (tbl.headers ? mapHeaders('tb', tbl.headers) : null);
  const rows = [];

      const g = k => { const v = parseNum(cellOf(r, map, k)); return v == null || Number.isNaN(v) ? null : v; };

      if (row.open == null && row.debit == null && row.credit == null && row.close == null) continue;
      rows.push(row);

      const cells = r.map(nfkc).filter(Boolean);
      const name = normName(cells.filter(c => !isNumCell(c) && !/%$/.test(c)).join(''));

      const row = nums.length >= 4 ? { open: nums[0], debit: nums[1], credit: nums[2], close: nums[3] } : nums.length === 3 ? { debit: nums[0], credit: nums[1], close: nums[2] } : { close: nums[nums.length - 1] };

}
function parseFsLines(rows, text) {
  const items = []; let section = 'pl';
  const unitK = /単位\s*[:：]?\s*千円|（千円）|\(千円\)/.test(nfkc(text));
  for (const r of rows) {
    const cells = r.map(nfkc).filter(Boolean);
    const joined = normName(cells.join(''));   // 「貸 借 対 照 表」のような字間の空白を除く
    if (/貸借対照表/.test(joined)) section = 'bs';
    if (/損益計算書|販売費及び一般管理費内訳|製造原価報告書/.test(joined)) section = 'pl';
    let name = null;
    for (let c of cells) {
      const m = c.match(/^(.+?)\s+([△▲\-−]?[\d,]{1,})$/);
      if (m && !isNumCell(m[1])) { pushItem(m[1], m[2]); name = null; continue; }
      if (isNumCell(c)) { if (name) { pushItem(name, c); name = null; } continue; }

    items.push({ section, name: n, amount: a });

}

async function pdfPageImages(file, maxPages) {
  const doc = await openPdf(file); const out = [];
  for (let p = 1; p <= Math.min(doc.numPages, maxPages); p++) {
    const page = await doc.getPage(p); const vp = page.getViewport({ scale: 1.7 });
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    out.push(await new Promise(r => cv.toBlob(r, 'image/png')));
  }
  return { images: out, total: doc.numPages };
}

        }
      };
      sideEntries(D, C, 1); sideEntries(C, D, -1);
    }
    batch.months = [...new Set(r.lines.map(l => { const f = fyIdx(l.date); return f.fy + '-' + f.i; }))];
  } else if (P.type === 'ledger') {
    for (const x of r.rows) {
      const a = resolveAcc(P, x.acc); if (!a) continue;
      if (isPL(a)) { S.entries.push({ id: uid(), date: x.date, acc: a.id, partner: x.partner || '', amount: Math.round(((x.debit || 0) - (x.credit || 0)) * plSign(a)), memo: x.memo, counter: x.counter, st: 'ledger', src: batch.id, created: 0 }); added++; }
      else if (a.cash) {
        const dir = (x.debit || 0) >= (x.credit || 0) ? 'in' : 'out';
        const amt = Math.abs((x.debit || 0) - (x.credit || 0)); if (!amt) continue;
        const c = classifyCounter(x.counter, dir);
        S.cashTx.push({ id: uid(), st: 'ledger', acct: a.name, date: x.date, in: dir === 'in' ? amt : 0, out: dir === 'out' ? amt : 0, desc: x.memo, counter: x.counter, key: c.key, how: c.how, src: batch.id }); added++;
      }
    }
  } else if (P.type === 'tb') {
    S.tb[o.fy] = S.tb[o.fy] || {};
    if (r.matrix) {
      for (const i of r.months) {
        const rows = [];
        for (const x of r.rows) { const a = resolveAcc(P, x.name); if (a && isPL(a) && x.mv[i] != null) rows.push({ acc: a.id, mv: x.mv[i] }); }
        if (rows.length) { S.tb[o.fy][i] = { rows, period: 'month', src: batch.id, matrix: true }; added += rows.length; }
      }
    } else {
      const rows = [];
      for (const x of r.rows) { const a = resolveAcc(P, x.name); if (a) rows.push({ acc: a.id, open: x.open, debit: x.debit, credit: x.credit, close: x.close }); }
      S.tb[o.fy][o.m] = { rows, period: o.cum ? 'cum' : 'month', src: batch.id }; added = rows.length;
      batch.period = `${yearOf(o.fy, o.m)}年${mLabel(o.m)}`;
    }
  } else if (P.type === 'fs') {
    const mul = o.unitK ? 1000 : 1, pl = {};
    for (const x of r.items.filter(x => x.section === 'pl')) {
      const a = resolveAcc(P, x.name); if (!a || !isPL(a)) continue;
      pl[a.id] = (pl[a.id] || 0) + fsSigned(x) * mul; added++;
    }
    const chk = fsCheck(P);
    S.annual[o.fy] = { pl, cashBS: chk.cash == null ? null : chk.cash * mul, src: batch.id, file: P.name };
    batch.period = fyLabel(o.fy);
  }
  batch.count = added;
  S.imports.unshift(batch);
  save(`${TYPE_LABEL[P.type]}を取り込みました（${added}件${skipped ? `・重複${skipped}件は除外` : ''}）`);
  // 資金繰り表がなければ作成し、予定の月を予算から下書き
  if (['bank', 'journal', 'ledger', 'tb'].includes(P.type)) {
    const fys = new Set(S.cashTx.filter(t => t.src === batch.id).map(t => fyIdx(t.date).fy));
    if (P.type === 'tb') fys.add(o.fy);
    for (const y of fys) { cache = {}; const isNew = !S.cash[y]; ensureCash(y); ensureAutoItems(y); if (isNew) draftCash(y, false); }
    save();
  }
  render();
}
function deleteBatch(id) {
  const b = S.imports.find(x => x.id === id); if (!b) return;
  snapshot(`取込の取消の前（${b.file}）`);
  S.entries = S.entries.filter(e => e.src !== id);
  S.cashTx = S.cashTx.filter(t => t.src !== id);
  for (const y of Object.keys(S.tb)) for (const i of Object.keys(S.tb[y])) if (S.tb[y][i].src === id) delete S.tb[y][i];
  for (const y of Object.keys(S.annual)) if (S.annual[y].src === id) delete S.annual[y];
  S.imports = S.imports.filter(x => x.id !== id);
  save('取込を取り消しました（取消前の状態はバックアップに保存）'); render();
}

function kpiData(k, fy) { return (k.data ||= {})[fy] ||= { t: nulls(), a: nulls() }; }
function kpiPeriod(k, fy, mode = ui.mode, m = ui.m) {
  const d = k.data?.[fy] || { t: nulls(), a: nulls() }, p = k.data?.[fy - 1] || { t: nulls(), a: nulls() };
  const f = k.agg === 'avg' ? avgN : (k.agg === 'last' ? (arr => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return arr[i]; return null; }) : (arr => sumN(arr)));
  const range = arr => mode === 'month' ? [arr[m]] : mode === 'cum' ? arr.slice(0, m + 1) : arr;
  const t = f(range(d.t)), a = f(range(d.a)), pa = f(range(p.a));
  const r = a == null || t == null || t === 0 ? null : a / t;
  return { t, a, r, yoy: a == null || pa == null || pa === 0 ? null : a / pa, pa };
}

    const arr = b[a.id] ||= nulls();
    const hasMonthly = prev.some(v => v != null) && lastIdx(fy - 1) === 11;
    const ann = S.annual?.[fy - 1]?.pl?.[a.id];
    for (let i = 0; i < 12; i++) {
      if (arr[i] != null) continue;
      let v = null;
      if (hasMonthly) v = prev[i];
      else if (ann != null) { v = ann / 12; fromAnnual++; }
      else v = prev[i];
      if (v != null) { arr[i] = Math.round(v * p / 100 / 1000) * 1000; n++; }
    }
  }
  save(`${n}か所の予算を作成しました${fromAnnual ? '（一部は前期決算書を12等分）' : ''}`); render();

function createSample() {
  const st = emptyState();
  st.settings.company = 'サンプル株式会社（架空）';
  st.settings.sample = true;

  let seed = 20261106;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const jit = (v, r = 0.1) => Math.round(v * (1 + (rnd() * 2 - 1) * r) / 100) * 100;
  const A = Object.fromEntries(st.accounts.map(a => [a.name, a.id]));
  const now = fyIdx(isoDate(new Date()));
  const fy = now.fy, curLast = now.i - 1;
  const season = [0.92, 0.95, 1.0, 0.9, 0.85, 1.05, 1.0, 1.02, 1.25, 0.88, 0.95, 1.18];
  const customers = [['青葉商事', .34, 'アオバシヨウジ'], ['北斗工業', .24, 'ホクトコウギヨウ'], ['みなと物産', .16, 'ミナトブツサン'], ['さくらシステムズ', .11, 'サクラシステムズ']];
  const push = (y, i, acc, amt, partner, memo, day) => st.entries.push({ id: uid(), date: monthDate(y, i, Math.min(day || 25, lastDay(y, i))), acc: A[acc], partner, amount: Math.round(amt), memo, created: 0, st: 'sample' });
  const gen = (y, upto, growth) => {
    for (let i = 0; i <= upto; i++) {
      const sales = 15500000 * season[i] * growth * (1 + (rnd() - .5) * .1);
      let rest = sales;
      customers.forEach(([n, s]) => { const v = jit(sales * s, .12); rest -= v; push(y, i, '売上高', v, n, `${mLabel(i)}分 請求`, 25); });
      const spots = 3 + Math.floor(rnd() * 3);
      for (let k = 0; k < spots; k++) push(y, i, '売上高', Math.max(10000, Math.round(rest / spots / 100) * 100), 'スポット顧客', 'スポット受注', 5 + k * 5);
      push(y, i, '仕入高', jit(sales * .43, .06), '東西資材', '材料仕入', 20);
      push(y, i, '仕入高', jit(sales * .05, .2), '丸山商店', '部材仕入', 28);
      push(y, i, '外注費', jit(sales * .08, .15), '協力会社みどり', '外注加工', 25);
      push(y, i, '役員報酬', 1200000, '', '役員報酬', 25);
      const pay = 2400000 * growth * (i === 2 || i === 8 ? 1.9 : 1);
      push(y, i, '給料手当', Math.round(pay / 100) * 100, '', i === 2 || i === 8 ? '給与・賞与' : '給与', 25);
      push(y, i, '法定福利費', Math.round(pay * .15 / 100) * 100, '年金事務所', '社会保険料', 28);
      push(y, i, '地代家賃', 450000, '本社ビル管理', '家賃', 27);
      push(y, i, '広告宣伝費', jit(300000, .4), 'ウェブ広告', '広告出稿', 15);
      push(y, i, '旅費交通費', jit(150000, .3), '', '出張・交通費', 20);
      push(y, i, '通信費', jit(62000, .05), '通信会社', '電話・回線', 26);
      push(y, i, '水道光熱費', jit([60, 62, 78, 85, 80, 66, 60, 70, 82, 88, 84, 70][i] * 1000, .05), '電力会社', '電気・ガス', 22);
      push(y, i, '消耗品費', jit(90000, .35), '文具オフィス', '事務用品', 18);
      push(y, i, '支払手数料', jit(48000, .2), '銀行', '振込手数料ほか', 28);
      push(y, i, '減価償却費', 200000, '', '月次償却', 28);
      push(y, i, '雑費', jit(30000, .5), '', '雑費', 20);
      push(y, i, '支払利息', 78000 - i * 500, '取引銀行', '借入利息', 26);
      if (i % 6 === 2) push(y, i, '受取利息', 1200, '取引銀行', '預金利息', 20);
      if (i === 4) push(y, i, '雑収入', 120000, '', '助成金', 15);
    }
  };
  gen(fy - 1, 11, 1.0);
  if (curLast >= 0) gen(fy, curLast, 1.06);
  cache = {};
  for (const [y, base, sg, cg] of [[fy - 1, fy - 1, .98, .98], [fy, fy - 1, 1.08, 1.03]]) {
    const b = st.budgets[y] = {};
    for (const a of st.accounts) {
      const line = actualLine(base, a.id);
      if (line.every(v => !v)) continue;
      b[a.id] = line.map(v => v == null ? null : Math.round(v * (a.cat === 'sales' ? sg : cg) / 10000) * 10000);
    }
  }
  cache = {};
  // 預金明細（サンプル銀行 普通）：前月の売上を当月末に回収、前月の仕入を当月末に支払
  const bank = { id: uid(), name: 'サンプル銀行 普通 …1234' }; st.banks.push(bank);
  const batch = { id: uid(), type: 'bank', file: 'サンプル預金明細.csv', ts: new Date().toISOString(), count: 0 };
  let bal = 25000000, seq = 1;
  const tx = (date, desc, inn, out) => { bal += inn - out; const c = classifyBank(desc, inn > 0 ? 'in' : 'out'); st.cashTx.push({ id: uid(), st: 'bank', acct: bank.id, date, in: inn, out, bal, desc, key: c.key, how: c.how, src: batch.id, seq: seq++ }); batch.count++; };
  st.cashTx.push({ id: uid(), st: 'bank', acct: bank.id, date: fyStartDate(fy), in: 0, out: 0, bal, desc: '繰越', key: 'transfer', how: 'carry', src: batch.id, seq: seq++ });
  st.rules.push({ id: uid(), pat: 'フリコミ トウザイシザイ', dir: 'out', key: 'ap' }, { id: uid(), pat: 'フリコミ マルヤマシヨウテン', dir: 'out', key: 'ap' }, { id: uid(), pat: 'フリコミ ジドウシヤハンバイ', dir: 'out', key: 'capex' });
  const sumAcc = (y, i, name, partner) => st.entries.filter(e => e.acc === A[name] && (!partner || e.partner === partner) && fyIdx(e.date).fy === y && fyIdx(e.date).i === i).reduce((s, e) => s + e.amount, 0);
  const realTx = tx; let monthBuf = [];
  for (let i = 0; i <= curLast; i++) {
    monthBuf = [];
    const tx = (date, desc, inn, out) => monthBuf.push([date, desc, inn, out]);   // 月内は日付順に並べてから残高を計算
    const py = i === 0 ? fy - 1 : fy, pi = i === 0 ? 11 : i - 1, d = day => monthDate(fy, i, Math.min(day, lastDay(fy, i)));
    tx(d(5), 'リソク', 0, 78000 - i * 500);
    tx(d(10), 'ゲンセンゼイ ゼイムシヨ', 0, Math.round((sumAcc(fy, i, '給料手当') + 1200000) * 0.05 / 100) * 100);
    customers.forEach(([n, , kana]) => tx(d(20), 'フリコミ ' + kana, sumAcc(py, pi, '売上高', n), 0));
    tx(d(22), 'フリコミ スポツト', sumAcc(py, pi, '売上高', 'スポット顧客'), 0);
    tx(d(25), 'キユウヨ', 0, Math.round((sumAcc(fy, i, '給料手当') + 1200000) * 0.85 / 100) * 100);
    tx(d(27), 'ヤチン ホンシヤビル', 0, 495000);
    tx(d(27), 'フリコミ トウザイシザイ', 0, sumAcc(py, pi, '仕入高', '東西資材'));
    tx(d(27), 'フリコミ マルヤマシヨウテン', 0, sumAcc(py, pi, '仕入高', '丸山商店'));
    tx(d(27), 'フリコミ キヨウリヨクガイシヤミドリ', 0, sumAcc(py, pi, '外注費'));
    tx(d(28), 'シヤカイホケン', 0, Math.round(sumAcc(fy, i, '法定福利費') * 2 / 100) * 100);
    tx(d(28), 'デンキ・ガス・NTT', 0, sumAcc(fy, i, '水道光熱費') + sumAcc(fy, i, '通信費'));
    tx(d(28), 'カード ゴリヨウ', 0, Math.round((sumAcc(fy, i, '広告宣伝費') + sumAcc(fy, i, '旅費交通費') + sumAcc(fy, i, '消耗品費') + sumAcc(fy, i, '雑費')) * 1.1 / 100) * 100);
    tx(d(28), 'テスウリヨウ', 0, sumAcc(fy, i, '支払手数料'));
    tx(d(28), 'ゴヘンサイ', 0, 300000);
    if (i === 3) tx(d(15), 'フリコミ ジドウシヤハンバイ', 0, 4500000);
    if (i === 5) tx(d(12), 'ゴユウシ', 10000000, 0);
    if (i === 4) tx(d(15), 'ジヨセイキン', 120000, 0);
    monthBuf.map((x, k) => [x, k]).sort((a, b) => a[0][0].localeCompare(b[0][0]) || a[1] - b[1]).forEach(([x]) => realTx(...x));
  }
  st.imports.push(batch);
  cache = {};
  st.cash[fy] = { opening: null, items: cashTemplate(), kind: Array(12).fill('plan'), manual: Array(12).fill(false) };
  ensureAutoItems(fy);
  draftCash(fy, false);
  const it = k => st.cash[fy].items.find(x => x.key === k);
  for (let i = curLast + 1; i < 12; i++) {
    it('loanout').values[i] = 300000;
    it('cashsales').values[i] = jit(150000, .3);
    it('tax').values[i] = i === 1 || i === 7 ? 3200000 : 900000;
  }
  if (curLast < 9) it('capex').values[9] = 1800000;
  const kp = (name, unit, agg, dir, base, noise, round1) => {
    const k = { id: uid(), name, unit, agg, dir, data: {} };
    for (const [y, g, upto] of [[fy - 1, 1, 11], [fy, 1.06, curLast]]) {
      const t = nulls(), a = nulls();
      for (let i = 0; i < 12; i++) {
        const v = base * season[i] * g;
        t[i] = round1 ? Math.round(v * 1.04 * 10) / 10 : Math.round(v * 1.04);
        if (i <= upto) { const x = v * (1 + (rnd() - .5) * noise); a[i] = round1 ? Math.round(x * 10) / 10 : Math.round(x); }
      }
      k.data[y] = { t, a };
    }
    st.kpis.push(k);
  };
  kp('受注件数', '件', 'sum', 'up', 48, .2);
  kp('平均受注単価', '円', 'avg', 'up', 250000, .12);
  kp('新規顧客数', '社', 'sum', 'up', 6, .5);
  kp('成約率', '%', 'avg', 'up', 32, .15, true);
  kp('クレーム件数', '件', 'sum', 'down', 3, .8);
  for (const y of [fy - 1, fy]) st.kpis[4].data[y].t = st.kpis[4].data[y].t.map(v => Math.max(1, Math.round(v * .7)));
  return st;
}

/* ---------- 起動 ---------- */
(async function init() {
  try { const th = localStorage.getItem(THEMEKEY); if (th) document.documentElement.dataset.theme = th; } catch (e) { }
  await load();
  if (S) { dailySnapshot(); if (migratedFromLS) { snapshot('保存先の移行前'); await save(); } }
  render();
})();
</script>
